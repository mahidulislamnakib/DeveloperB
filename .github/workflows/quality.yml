name: DeveloperB quality gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: developerb-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, tests, dependencies and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # A committed package-lock.json is still needed for reproducible npm ci.
      # Until then, npm install runs against existing package.json constraints.
      - name: Install dependencies
        run: npm install --no-fund
      - name: Check TypeScript
        run: npm run typecheck
      - name: Run unit and Worker tests
        run: npm run test
      - name: Lint
        run: npm run lint
      - name: Production dependency vulnerability audit
        run: npm audit --omit=dev --audit-level=high --no-fund
