name: DeveloperB quality gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: developerb-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, tests, dependencies and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Until a lockfile is reviewed and committed, this is not reproducible.
      # Pin the npm CLI to avoid the dependency-tree "edgesOut" resolver bug
      # observed with the runner's bundled npm 10.9.4.
      - name: Select npm CLI
        run: npm install --global npm@11.6.2 --no-fund
      - name: Install dependencies
        run: npm install --no-fund
      - name: Check TypeScript
        run: npm run typecheck
      - name: Run unit and Worker tests
        run: npm run test
      - name: Lint
        run: npm run lint
      - name: Production dependency vulnerability audit
        run: npm audit --omit=dev --audit-level=high --no-fund
